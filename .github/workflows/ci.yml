name: "CI — Fluxo de Caixa"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FluxoDeCaixa.sln

      - name: Build
        run: dotnet build FluxoDeCaixa.sln --no-restore -c Release

      - name: Unit Tests
        run: >
          dotnet test tests/FluxoDeCaixa.Tests.Unit
          --no-build -c Release
          --logger "trx;LogFileName=unit-tests.trx"

      # Os testes de integração sobem PostgreSQL e RabbitMQ via Testcontainers
      # (o runner do GitHub já tem Docker), então não há services: declarados.
      - name: Integration Tests
        run: >
          dotnet test tests/FluxoDeCaixa.Tests.Integration
          --no-build -c Release
          --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Image
        run: docker build -t fluxo-api -f src/FluxoDeCaixa.Api/Dockerfile .

      - name: Build Web Image
        run: docker build -t fluxo-web -f src/FluxoDeCaixa.Web/Dockerfile .

      - name: Smoke Test (Docker Compose)
        run: |
          set -euo pipefail
          docker compose up -d --wait
          # A API só fica healthy quando /health/ready responde 200
          curl -fsS http://localhost:5000/health/ready
          curl -fsS http://localhost:5000/auth/categorias
          # O realm do Keycloak precisa ter sido importado
          curl -fsS http://localhost:8081/realms/fluxocaixa/.well-known/openid-configuration > /dev/null
          # Fluxo autenticado ponta a ponta com token real do IdP
          TOKEN=$(curl -fsS -X POST \
            http://localhost:8081/realms/fluxocaixa/protocol/openid-connect/token \
            -d 'client_id=fluxocaixa-testes' \
            -d 'grant_type=password' \
            -d 'username=demo@loja.com' \
            -d 'password=Senha123!' | jq -r .access_token)
          test -n "$TOKEN" && test "$TOKEN" != "null"
          curl -fsS "http://localhost:5000/consolidado/diario?data=$(date -u +%F)" \
            -H "Authorization: Bearer $TOKEN"
          # Sem token o endpoint precisa recusar
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost:5000/consolidado/diario?data=$(date -u +%F)")" = "401"

      - name: Compose Logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Teardown
        if: always()
        run: docker compose down -v
