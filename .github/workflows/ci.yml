name: "CI — Fluxo de Caixa"

# Em multi-repo real, cada serviço teria seu próprio arquivo de workflow no seu
# próprio repositório. Aqui os três coexistem em jobs independentes, com
# `paths` filtrando o que cada um observa — o efeito prático é o mesmo:
# mudar o worker não dispara o build do serviço de lançamentos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  carrefour-ms-fluxodecaixa:
    name: "MS · Lançamentos"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/carrefour.ms.fluxodecaixa

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit Tests
        run: >
          dotnet test tests/Carrefour.MS.FluxoDeCaixa.Tests.Unit
          --no-build -c Release
          --logger "trx;LogFileName=ms-unit.trx"

      # Sobe PostgreSQL, RabbitMQ e Keycloak via Testcontainers.
      # O worker NÃO participa: tudo aqui passa com a consolidação ausente.
      - name: Integration Tests
        run: >
          dotnet test tests/Carrefour.MS.FluxoDeCaixa.Tests.Integration
          --no-build -c Release
          --logger "trx;LogFileName=ms-integration.trx"

      - name: Vulnerabilidades em dependências
        run: dotnet list package --vulnerable --include-transitive

      - name: Build da imagem
        run: docker build -t carrefour-ms-fluxodecaixa .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ms-test-results
          path: "**/TestResults/*.trx"

  # ───────────────────────────────────────────────────────────────────────────
  carrefour-wkr-consolidacao:
    name: "WKR · Consolidação"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/carrefour.wkr.consolidacao

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Publica no barramento e verifica a materialização do read model,
      # sem envolver o serviço de lançamentos.
      - name: Tests
        run: >
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=wkr.trx"

      - name: Vulnerabilidades em dependências
        run: dotnet list package --vulnerable --include-transitive

      - name: Build da imagem
        run: docker build -t carrefour-wkr-consolidacao .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wkr-test-results
          path: "**/TestResults/*.trx"

  # ───────────────────────────────────────────────────────────────────────────
  fluxodecaixa-web:
    name: "Web · Frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fluxodecaixa.web

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Build da imagem
        run: docker build -t fluxodecaixa-web .

  # ───────────────────────────────────────────────────────────────────────────
  # Integração entre serviços — o único job que conhece todos eles.
  e2e:
    name: "E2E · Ambiente completo"
    runs-on: ubuntu-latest
    needs: [carrefour-ms-fluxodecaixa, carrefour-wkr-consolidacao, fluxodecaixa-web]

    steps:
      - uses: actions/checkout@v4

      - name: Sobe o ambiente
        run: docker compose up -d --build --wait

      - name: Smoke test autenticado
        run: |
          set -euo pipefail
          curl -fsS http://localhost:5000/health/ready
          curl -fsS http://localhost:5001/health/ready
          curl -fsS http://localhost:8081/realms/fluxocaixa/.well-known/openid-configuration > /dev/null

          TOKEN=$(curl -fsS -X POST \
            http://localhost:8081/realms/fluxocaixa/protocol/openid-connect/token \
            -d 'client_id=fluxocaixa-testes' -d 'grant_type=password' \
            -d 'username=demo@loja.com' -d 'password=Senha123!' | jq -r .access_token)
          test -n "$TOKEN" && test "$TOKEN" != "null"

          # Sem token, recusa
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost:5000/consolidado/diario?data=$(date -u +%F)")" = "401"

          # Fluxo completo: lançamento no MS, consolidação pelo WKR
          HOJE=$(date -u +%F)
          ANTES=$(curl -fsS "http://localhost:5000/consolidado/diario?data=$HOJE" \
            -H "Authorization: Bearer $TOKEN" | jq -r .quantidadeLancamentos)

          curl -fsS -X POST http://localhost:5000/lancamentos \
            -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" \
            -d "{\"valor\":10.00,\"tipo\":\"Credito\",\"data\":\"$HOJE\",\"descricao\":\"ci\",\"categoria\":\"Vendas\"}"

          sleep 5
          DEPOIS=$(curl -fsS "http://localhost:5000/consolidado/diario?data=$HOJE" \
            -H "Authorization: Bearer $TOKEN" | jq -r .quantidadeLancamentos)
          test "$DEPOIS" -eq "$((ANTES + 1))"

      # O requisito não-funcional do enunciado, verificado no pipeline.
      - name: "RNF — lançamentos sobrevivem à queda da consolidação"
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -X POST \
            http://localhost:8081/realms/fluxocaixa/protocol/openid-connect/token \
            -d 'client_id=fluxocaixa-testes' -d 'grant_type=password' \
            -d 'username=demo@loja.com' -d 'password=Senha123!' | jq -r .access_token)

          docker compose stop carrefour.wkr.consolidacao

          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5000/lancamentos \
              -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" \
              -d "{\"valor\":10.00,\"tipo\":\"Credito\",\"data\":\"$(date -u +%F)\",\"descricao\":\"sem worker $i\",\"categoria\":\"Vendas\"}")
            test "$CODE" = "201"
          done

          curl -fsS http://localhost:5000/health/ready
          docker compose start carrefour.wkr.consolidacao

      - name: Logs (em caso de falha)
        if: failure()
        run: docker compose logs --no-color

      - name: Teardown
        if: always()
        run: docker compose down -v
