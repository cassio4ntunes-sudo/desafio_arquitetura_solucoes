server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM SPA — route all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|wasm|dll|dat|blat|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression for Blazor WASM
    gzip on;
    gzip_types application/javascript application/wasm application/octet-stream text/css text/html application/json;
    gzip_min_length 256;
}
